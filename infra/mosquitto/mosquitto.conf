# Stage A / B only: anonymous and unencrypted. Never expose this beyond a firewalled test setup.
listener 1883
allow_anonymous true

# Keep sessions and queued messages across broker restarts.
persistence true
persistence_location /mosquitto/data/

# The worker uses a persistent session, so the broker queues QoS 1 messages while it is down.
# The default (1000) would drop messages in the 20 s restart test (100 msg/s x 20 s = 2000).
max_queued_messages 100000
