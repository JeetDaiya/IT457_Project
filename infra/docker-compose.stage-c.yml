# Stage C: the app on the EC2 VM, with managed services instead of containers.
#   - database: RDS PostgreSQL (no postgres container)
#   - input:    SQS queue fed by an IoT Core rule (no mosquitto container)
# Same image as Stages A and B. Run from the repo root on the VM:
#   docker compose --env-file .env -f infra/docker-compose.stage-c.yml up -d --build
#
# Needs in .env (never committed; see .env.example):
#   RDS_HOST, RDS_USER, RDS_PASSWORD, RDS_DB   (RDS_PASSWORD must be URL-safe: letters and digits only,
#                                               or percent-encode special characters)
#   SQS_QUEUE_URL
# Needs on the VM: the AWS RDS CA bundle (public), at RDS_CA_BUNDLE (default ~/global-bundle.pem):
#   curl -o ~/global-bundle.pem https://truststore.pki.rds.amazonaws.com/global/global-bundle.pem
# AWS credentials: none in any file. boto3 reads the EC2 instance role through the metadata service
# (IMDSv2 required, hop limit 2 so containers can reach it).

x-app: &app
  build:
    context: ..
    dockerfile: infra/Dockerfile
  environment:
    # "+psycopg2" is required (see GOTCHAS). verify-full encrypts and checks that the server is our RDS.
    DATABASE_URL: postgresql+psycopg2://${RDS_USER:?set RDS_USER in .env}:${RDS_PASSWORD:?set RDS_PASSWORD in .env}@${RDS_HOST:?set RDS_HOST in .env}:5432/${RDS_DB:?set RDS_DB in .env}?sslmode=verify-full&sslrootcert=/certs/global-bundle.pem
    # Only the worker reads the queue; the api loads the same settings and ignores them.
    INPUT_MODE: sqs
    SQS_QUEUE_URL: ${SQS_QUEUE_URL:?set SQS_QUEUE_URL in .env}
    AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-ap-south-1}
    LOG_LEVEL: ${LOG_LEVEL:-INFO}
    SEED_PATIENTS: ${SEED_PATIENTS:-100}
  volumes:
    - ${RDS_CA_BUNDLE:-${HOME}/global-bundle.pem}:/certs/global-bundle.pem:ro
  restart: unless-stopped

services:
  api:
    <<: *app
    command: ["python", "-m", "app.main", "api"]
    ports:
      # BIND_IP limits who can connect; default is all interfaces (the security group is the real filter).
      - "${BIND_IP:-0.0.0.0}:8000:8000"

  worker:
    <<: *app
    command: ["python", "-m", "app.main", "worker"]
